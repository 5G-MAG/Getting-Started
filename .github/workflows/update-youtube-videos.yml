name: Update YouTube Video Grid

on:
  schedule:
    - cron: '0 6 * * *'  # Runs daily at 06:00 UTC
  workflow_dispatch:      # Allows manual trigger from GitHub Actions tab

jobs:
  update-videos:
    runs-on: ubuntu-latest

    permissions:
      contents: write     # Needed to commit changes back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch YouTube RSS and update tutorials.md
        run: |
          python3 << 'EOF'
          import urllib.request
          import xml.etree.ElementTree as ET
          import re
          from datetime import datetime

          PLAYLIST_ID = "PLFqKJZ78_IWUibB6dMiabaVNDFLSGBWlx"
          RSS_URL = "https://www.youtube.com/feeds/videos.xml?playlist_id=" + PLAYLIST_ID
          MD_FILE = "pages/5g-media-streaming/tutorials.md"

          # --- Fetch and parse RSS feed ---
          print("Fetching RSS feed: " + RSS_URL)
          with urllib.request.urlopen(RSS_URL) as response:
              xml_content = response.read()

          ns = {
              'atom': 'http://www.w3.org/2005/Atom',
              'yt':   'http://www.youtube.com/xml/schemas/2015',
              'media':'http://search.yahoo.com/mrss/',
          }

          root = ET.fromstring(xml_content)
          entries = root.findall('atom:entry', ns)

          # Build list of (published_datetime, video_id, title)
          videos = []
          for entry in entries:
              video_id  = entry.find('yt:videoId', ns).text
              title     = entry.find('atom:title', ns).text
              published = entry.find('atom:published', ns).text
              dt = datetime.fromisoformat(published.replace('Z', '+00:00'))
              videos.append((dt, video_id, title))

          # Sort newest first
          videos.sort(key=lambda x: x[0], reverse=True)
          print("Found " + str(len(videos)) + " videos.")

          # --- Build responsive HTML grid ---
          items_html = ""
          for _, vid_id, title in videos:
              safe_title = title.replace('"', '&quot;')
              items_html += '  <div class="yt-item">\n'
              items_html += '    <div class="yt-embed-wrapper">\n'
              items_html += '      <iframe\n'
              items_html += '        src="https://www.youtube.com/embed/' + vid_id + '"\n'
              items_html += '        title="' + safe_title + '"\n'
              items_html += '        frameborder="0"\n'
              items_html += '        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"\n'
              items_html += '        referrerpolicy="strict-origin-when-cross-origin"\n'
              items_html += '        allowfullscreen></iframe>\n'
              items_html += '    </div>\n'
              items_html += '  </div>\n'

          style_block = (
              "<style>\n"
              "  .yt-grid {\n"
              "    display: grid;\n"
              "    grid-template-columns: repeat(2, 1fr);\n"
              "    gap: 1rem;\n"
              "    width: 100%;\n"
              "  }\n"
              "  @media (max-width: 640px) {\n"
              "    .yt-grid { grid-template-columns: 1fr; }\n"
              "  }\n"
              "  .yt-embed-wrapper {\n"
              "    position: relative;\n"
              "    width: 100%;\n"
              "    padding-bottom: 56.25%;\n"
              "    height: 0;\n"
              "    overflow: hidden;\n"
              "  }\n"
              "  .yt-embed-wrapper iframe {\n"
              "    position: absolute;\n"
              "    top: 0;\n"
              "    left: 0;\n"
              "    width: 100%;\n"
              "    height: 100%;\n"
              "  }\n"
              "</style>\n"
          )

          new_block = (
              "<!-- YOUTUBE-GRID-START -->\n"
              + style_block
              + '<div class="yt-grid">\n'
              + items_html
              + "</div>\n"
              + "<!-- YOUTUBE-GRID-END -->"
          )

          # --- Replace the block in the Markdown file ---
          with open(MD_FILE, 'r', encoding='utf-8') as f:
              content = f.read()

          pattern = r'<!-- YOUTUBE-GRID-START -->.*?<!-- YOUTUBE-GRID-END -->'
          if re.search(pattern, content, flags=re.DOTALL):
              updated = re.sub(pattern, new_block, content, flags=re.DOTALL)
              print("Replaced existing video grid block.")
          else:
              print("WARNING: markers not found in the Markdown file.")
              updated = content

          with open(MD_FILE, 'w', encoding='utf-8') as f:
              f.write(updated)

          print("Done.")
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/5g-media-streaming/tutorials.md
          git diff --cached --quiet && echo "No changes to commit." || \
            (git commit -m "chore: update YouTube video grid [skip ci]" && git push)
